[project]
name = "ilda"
version = "0.1.0"
description = "Python toolkit for converting bitmap and vector images to ILDA format for laser show control systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "potracer>=0.0.4",
    "ruff>=0.14.10",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
